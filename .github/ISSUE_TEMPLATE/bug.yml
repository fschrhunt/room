name: Bug
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command that shows it
      render: sh
  - type: textarea
    id: doctor
    attributes:
      label: Output of `room doctor`
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `room version` and your macOS version
