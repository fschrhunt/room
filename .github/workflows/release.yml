name: release

# A tag vX.Y.Z on main releases room: the same checks as CI, a source archive with
# checksums and build provenance, notes from CHANGELOG.md, the Homebrew formula on
# main, and a real install of the release on both macOS and Linux.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version to release, such as v0.1.0
        required: true
        type: string

permissions: {}

jobs:
  tag:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
      - name: Validate the release and push its tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = refs/heads/main || { echo 'Run releases from main.' >&2; exit 1; }
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "Invalid release tag: $TAG" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          commit=$(git rev-parse HEAD)
          result=$(gh run list --workflow ci.yml --branch main --event push --commit "$commit" --json status,conclusion -q '.[0] | "\(.status) \(.conclusion)"')
          [ "$result" = 'completed success' ] || { echo "CI on main ($commit) is '$result'; wait for it to pass." >&2; exit 1; }
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  check:
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tag is on main and has notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$TAG is not on main" >&2; exit 1; }
          grep -q "^## $TAG " CHANGELOG.md || { echo "CHANGELOG.md has no ## $TAG section" >&2; exit 1; }
      - name: Install lint tools
        run: brew install shellcheck shfmt actionlint
      - run: ./x check
      - run: ./x release-check "$TAG"

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the source archive and checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          plain=${TAG#v}
          dir="room-$plain"
          rm -rf "$dir" dist
          mkdir -p "$dir" dist
          install -m 755 bin/room "$dir/room"
          install -m 755 install.sh "$dir/install.sh"
          cp README.md LICENSE CHANGELOG.md "$dir/"
          cp -R assets "$dir/assets"
          tar -czf "dist/$dir.tar.gz" "$dir"
          rm -rf "$dir"
          (cd dist && sha256sum -- "room-$plain.tar.gz" > checksums.txt)
      # Proves the archive was built here, from this tag: gh attestation verify FILE -R fschrhunt/room
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # The notes are the tag's section of CHANGELOG.md, from its heading to the next.
        run: |
          ./scripts/release-notes.sh "$TAG" < CHANGELOG.md > notes.md
          gh release create "$TAG" dist/*.tar.gz dist/checksums.txt --verify-tag --title "$TAG" --notes-file notes.md

  # Refreshes the Homebrew formula after publishing the release.
  formula:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
      - name: Point the Homebrew formula at the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p checksums.txt -O "$RUNNER_TEMP/checksums.txt"
          scripts/formula.sh "$TAG" "$RUNNER_TEMP/checksums.txt" > room.rb
          # Stage first: a brand-new formula is untracked, which git diff never shows.
          git add room.rb
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "release: $TAG"
          git push origin HEAD:main

  install:
    needs: release
    # Release assets on a private repository need auth, which install.sh does not
    # send; the install test runs once the repository is public.
    if: github.event.repository.visibility == 'public'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the release as people will
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh install.sh --version "$TAG" --dir "$RUNNER_TEMP/room"
          test "$("$RUNNER_TEMP/room/room" version)" = "room ${TAG#v}"
